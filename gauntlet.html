<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARRAKIS — Gauntlet Loop Progress Workbench</title>
    <style>
      :root {
        --bg: #0b0907;
        --panel: #16110d;
        --border: rgba(217, 155, 76, 0.24);
        --gold: #e4a95c;
        --spice: #4ba3ff;
        --text: #efe5d6;
        --muted: #a69580;
        --pass: #5fd18b;
        --fail: #ff6b5b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at top, #1d140c 0%, var(--bg) 60%);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        padding: 32px;
      }
      header {
        max-width: 1280px;
        margin: 0 auto 28px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 18px;
      }
      h1 { margin: 0; font-family: Georgia, serif; letter-spacing: 0.14em; color: var(--gold); }
      .sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .filter-pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filter-pill {
        appearance: none;
        background: rgba(255, 255, 255, 0.03);
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .filter-pill:hover {
        color: var(--text);
        border-color: rgba(228, 169, 92, 0.55);
      }
      .filter-pill.active {
        background: rgba(228, 169, 92, 0.18);
        color: var(--gold);
        border-color: var(--gold);
      }
      .back-link {
        color: var(--spice);
        text-decoration: none;
        border: 1px solid rgba(75, 163, 255, 0.4);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
      }
      .rounds {
        max-width: 1280px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }
      .round-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      .round-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .round-title { font-size: 18px; font-weight: 600; color: var(--gold); }
      .badge {
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .badge.PASS { background: rgba(95, 209, 139, 0.16); color: var(--pass); border: 1px solid rgba(95, 209, 139, 0.45); }
      .badge.FAIL { background: rgba(255, 107, 91, 0.16); color: var(--fail); border: 1px solid rgba(255, 107, 91, 0.45); }
      .badge.IN_PROGRESS { background: rgba(75, 163, 255, 0.16); color: var(--spice); border: 1px solid rgba(75, 163, 255, 0.45); }
      .verdict-notes { color: var(--text); font-size: 14px; line-height: 1.55; white-space: pre-wrap; margin-bottom: 16px; }
      .thumbs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      .thumb {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        overflow: hidden;
        background: #080605;
      }
      .thumb img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
      .thumb span { display: block; padding: 6px 10px; font-size: 12px; color: var(--muted); }
      .empty { text-align: center; padding: 64px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>GAUNTLET LOOP // ARRAKIS</h1>
        <p class="sub">Fresh-context visual critic progression &amp; automated WebGL2 telemetry</p>
      </div>
      <div class="header-actions">
        <div class="filter-pills" id="wave-filters" role="group" aria-label="Filter rounds by wave">
          <button class="filter-pill active" type="button" data-wave="all">All</button>
          <button class="filter-pill" type="button" data-wave="wave1">Wave 1</button>
          <button class="filter-pill" type="button" data-wave="wave2">Wave 2</button>
          <button class="filter-pill" type="button" data-wave="wave3">Wave 3</button>
          <button class="filter-pill" type="button" data-wave="wave4">Wave 4</button>
        </div>
        <a class="back-link" href="/">← Return to Arrakis</a>
      </div>
    </header>
    <main class="rounds" id="rounds"><div class="empty">Loading Gauntlet history…</div></main>
    <script>
      let activeWave = 'all';
      let cachedRounds = [];

      function matchesWave(r, wave) {
        if (wave === 'all') return true;
        const n = wave.replace('wave', '');
        const haystack = `${r.round || ''} ${r.title || ''}`.toLowerCase();
        return haystack.includes(`(${wave})`) || haystack.includes(wave) || new RegExp(`(?:^|[-_])w${n}(?:[-_]|$)`).test(haystack);
      }

      function renderRounds() {
        const root = document.getElementById('rounds');
        if (!cachedRounds.length) {
          root.innerHTML = '<div class="empty">No Gauntlet rounds recorded yet.</div>';
          return;
        }
        const filtered = cachedRounds.filter(r => matchesWave(r, activeWave)).slice().reverse();
        if (!filtered.length) {
          root.innerHTML = `<div class="empty">No rounds found for ${activeWave.replace('wave', 'Wave ')}.</div>`;
          return;
        }
        root.innerHTML = filtered.map(r => `
          <article class="round-card">
            <div class="round-head">
              <div>
                <div class="round-title">${r.title}</div>
                <div class="sub">${r.timestamp} · ${r.metrics || ''}</div>
              </div>
              <span class="badge ${r.verdict}">${r.verdict}</span>
            </div>
            <div class="verdict-notes">${(r.summary || '').replace(/</g, '&lt;')}</div>
            <div class="thumbs">
              ${(r.images || []).map(img => `
                <a class="thumb" href="${img.url}" target="_blank">
                  <img src="${img.url}" loading="lazy" alt="${img.label}" onerror="this.closest('a').style.display='none'" />
                  <span>${img.label}</span>
                </a>
              `).join('')}
            </div>
          </article>
        `).join('');
      }

      document.getElementById('wave-filters')?.addEventListener('click', e => {
        const btn = e.target.closest('button[data-wave]');
        if (!btn) return;
        activeWave = btn.dataset.wave || 'all';
        document.querySelectorAll('#wave-filters .filter-pill').forEach(el => {
          el.classList.toggle('active', el === btn);
        });
        renderRounds();
      });

      async function load() {
        const root = document.getElementById('rounds');
        try {
          const res = await fetch('/gauntlet/history.json?t=' + Date.now());
          if (!res.ok) throw new Error('No history yet');
          const data = await res.json();
          cachedRounds = data.rounds || [];
          renderRounds();
        } catch (err) {
          root.innerHTML = '<div class="empty">Waiting for Round 1 captures…</div>';
        }
      }
      load();
      setInterval(load, 8000);
    </script>
  </body>
</html>
