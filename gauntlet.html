<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARRAKIS — Gauntlet Loop Progress Workbench</title>
    <style>
      :root {
        --bg: #0b0907;
        --panel: #16110d;
        --border: rgba(217, 155, 76, 0.24);
        --gold: #e4a95c;
        --spice: #4ba3ff;
        --text: #efe5d6;
        --muted: #a69580;
        --pass: #5fd18b;
        --fail: #ff6b5b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at top, #1d140c 0%, var(--bg) 60%);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        padding: 32px;
      }
      header {
        max-width: 1280px;
        margin: 0 auto 28px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 1px solid var(--border);
        padding-bottom: 18px;
      }
      h1 { margin: 0; font-family: Georgia, serif; letter-spacing: 0.14em; color: var(--gold); }
      .sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
      .back-link {
        color: var(--spice);
        text-decoration: none;
        border: 1px solid rgba(75, 163, 255, 0.4);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
      }
      .rounds {
        max-width: 1280px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }
      .round-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      .round-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .round-title { font-size: 18px; font-weight: 600; color: var(--gold); }
      .badge {
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .badge.PASS { background: rgba(95, 209, 139, 0.16); color: var(--pass); border: 1px solid rgba(95, 209, 139, 0.45); }
      .badge.FAIL { background: rgba(255, 107, 91, 0.16); color: var(--fail); border: 1px solid rgba(255, 107, 91, 0.45); }
      .badge.IN_PROGRESS { background: rgba(75, 163, 255, 0.16); color: var(--spice); border: 1px solid rgba(75, 163, 255, 0.45); }
      .verdict-notes { color: var(--text); font-size: 14px; line-height: 1.55; white-space: pre-wrap; margin-bottom: 16px; }
      .thumbs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      .thumb {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        overflow: hidden;
        background: #080605;
      }
      .thumb img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
      .thumb span { display: block; padding: 6px 10px; font-size: 12px; color: var(--muted); }
      .empty { text-align: center; padding: 64px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>GAUNTLET LOOP // ARRAKIS</h1>
        <p class="sub">Fresh-context visual critic progression &amp; automated WebGL2 telemetry</p>
      </div>
      <a class="back-link" href="/">← Return to Arrakis</a>
    </header>
    <main class="rounds" id="rounds"><div class="empty">Loading Gauntlet history…</div></main>
    <script>
      async function load() {
        const root = document.getElementById('rounds');
        try {
          const res = await fetch('/gauntlet/history.json?t=' + Date.now());
          if (!res.ok) throw new Error('No history yet');
          const data = await res.json();
          if (!data.rounds?.length) {
            root.innerHTML = '<div class="empty">No Gauntlet rounds recorded yet.</div>';
            return;
          }
          root.innerHTML = data.rounds.slice().reverse().map(r => `
            <article class="round-card">
              <div class="round-head">
                <div>
                  <div class="round-title">${r.title}</div>
                  <div class="sub">${r.timestamp} · ${r.metrics || ''}</div>
                </div>
                <span class="badge ${r.verdict}">${r.verdict}</span>
              </div>
              <div class="verdict-notes">${(r.summary || '').replace(/</g, '&lt;')}</div>
              <div class="thumbs">
                ${(r.images || []).map(img => `
                  <a class="thumb" href="${img.url}" target="_blank">
                    <img src="${img.url}" loading="lazy" alt="${img.label}" onerror="this.closest('a').style.display='none'" />
                    <span>${img.label}</span>
                  </a>
                `).join('')}
              </div>
            </article>
          `).join('');
        } catch (err) {
          root.innerHTML = '<div class="empty">Waiting for Round 1 captures…</div>';
        }
      }
      load();
      setInterval(load, 8000);
    </script>
  </body>
</html>
